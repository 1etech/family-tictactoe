<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<meta name="color-scheme" content="light dark" />
<title>Family Tic Tac Toe</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>✳️</text></svg>" />
<style>
  :root {
    --bg: #f6f1e8;
    --panel: #fffdf9;
    --ink: #2b2520;
    --muted: #7a6e63;
    --line: #e2d6c5;
    --x: #c2410c;
    --o: #0f766e;
    --accent: #7c3aed;
    --accent-ink: #ffffff;
    --win: #fde68a;
    --shadow: 0 1px 2px rgba(43, 37, 32, .06), 0 8px 24px rgba(43, 37, 32, .08);
    --radius: 14px;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #17140f;
      --panel: #211d17;
      --ink: #f0e9df;
      --muted: #a2968a;
      --line: #3a3229;
      --x: #fb923c;
      --o: #2dd4bf;
      --accent: #a78bfa;
      --accent-ink: #1b1510;
      --win: #4d3f12;
      --shadow: 0 1px 2px rgba(0, 0, 0, .4), 0 8px 24px rgba(0, 0, 0, .35);
    }
  }
  :root[data-theme="dark"] {
    --bg: #17140f;
    --panel: #211d17;
    --ink: #f0e9df;
    --muted: #a2968a;
    --line: #3a3229;
    --x: #fb923c;
    --o: #2dd4bf;
    --accent: #a78bfa;
    --accent-ink: #1b1510;
    --win: #4d3f12;
    --shadow: 0 1px 2px rgba(0, 0, 0, .4), 0 8px 24px rgba(0, 0, 0, .35);
  }

  * { box-sizing: border-box; }

  body {
    margin: 0;
    min-height: 100dvh;
    background: var(--bg);
    color: var(--ink);
    font: 16px/1.5 ui-rounded, "Segoe UI", system-ui, -apple-system, sans-serif;
    display: flex;
    flex-direction: column;
    align-items: center;
    padding: clamp(16px, 4vw, 40px) 16px 40px;
    gap: 20px;
  }

  h1 {
    margin: 0;
    font-size: clamp(24px, 6vw, 34px);
    letter-spacing: -.02em;
    text-align: center;
  }
  h1 small {
    display: block;
    font-size: 14px;
    font-weight: 400;
    color: var(--muted);
    letter-spacing: 0;
    margin-top: 4px;
  }

  .panel {
    width: 100%;
    max-width: 440px;
    background: var(--panel);
    border: 1px solid var(--line);
    border-radius: var(--radius);
    box-shadow: var(--shadow);
    padding: 20px;
  }

  label { display: block; font-size: 13px; font-weight: 600; color: var(--muted); margin-bottom: 6px; }

  input[type="text"] {
    width: 100%;
    padding: 12px 14px;
    font: inherit;
    color: var(--ink);
    background: var(--bg);
    border: 1px solid var(--line);
    border-radius: 10px;
  }
  input[type="text"]:focus-visible { outline: 2px solid var(--accent); outline-offset: 1px; }

  button {
    font: inherit;
    font-weight: 600;
    cursor: pointer;
    border-radius: 10px;
    border: 1px solid var(--line);
    background: var(--panel);
    color: var(--ink);
    padding: 12px 16px;
    transition: transform .06s ease, filter .15s ease;
  }
  button:hover:not(:disabled) { filter: brightness(1.04); }
  button:active:not(:disabled) { transform: translateY(1px); }
  button:disabled { opacity: .45; cursor: not-allowed; }
  button:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
  button.primary { background: var(--accent); color: var(--accent-ink); border-color: transparent; }

  .row { display: flex; gap: 10px; }
  .row > * { flex: 1; }
  .stack { display: flex; flex-direction: column; gap: 14px; }
  .divider { display: flex; align-items: center; gap: 10px; color: var(--muted); font-size: 13px; }
  .divider::before, .divider::after { content: ""; flex: 1; height: 1px; background: var(--line); }

  #code-input { text-transform: uppercase; letter-spacing: .3em; font-weight: 700; text-align: center; }

  /* --- game --- */
  #game { width: 100%; max-width: 440px; display: flex; flex-direction: column; gap: 16px; }

  .roombar {
    display: flex; align-items: center; justify-content: space-between; gap: 10px;
    background: var(--panel); border: 1px solid var(--line); border-radius: var(--radius);
    padding: 12px 14px; box-shadow: var(--shadow);
  }
  .roombar .code { font-size: 22px; font-weight: 800; letter-spacing: .22em; }
  .roombar .code-label { font-size: 11px; text-transform: uppercase; letter-spacing: .08em; color: var(--muted); }
  .roombar button { padding: 9px 12px; font-size: 14px; }

  .scoreboard { display: grid; grid-template-columns: 1fr auto 1fr; gap: 10px; align-items: stretch; }
  .side {
    background: var(--panel); border: 1px solid var(--line); border-radius: var(--radius);
    padding: 12px; text-align: center; box-shadow: var(--shadow); min-width: 0;
  }
  .side.active { border-color: currentColor; }
  .side.x { color: var(--x); }
  .side.o { color: var(--o); }
  .side .mark { font-size: 26px; font-weight: 800; line-height: 1; }
  .side .who {
    font-size: 13px; font-weight: 600; color: var(--ink); margin-top: 4px;
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
  }
  .side .who.empty { color: var(--muted); font-weight: 400; font-style: italic; }
  .side .score { font-size: 20px; font-weight: 700; color: var(--ink); margin-top: 6px; }
  .side .away { font-size: 11px; color: var(--muted); }
  .side button { margin-top: 8px; width: 100%; padding: 7px; font-size: 13px; }
  .draws { align-self: center; text-align: center; color: var(--muted); font-size: 12px; padding: 0 4px; }
  .draws b { display: block; font-size: 18px; color: var(--ink); }

  #status { text-align: center; font-weight: 600; min-height: 24px; }
  #status.win { color: var(--accent); }

  .board {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 8px;
    aspect-ratio: 1;
    background: var(--panel);
    border: 1px solid var(--line);
    border-radius: var(--radius);
    padding: 8px;
    box-shadow: var(--shadow);
  }
  .cell {
    border: none;
    border-radius: 10px;
    background: var(--bg);
    font-size: clamp(34px, 13vw, 58px);
    font-weight: 800;
    line-height: 1;
    display: flex; align-items: center; justify-content: center;
    padding: 0;
    transition: background .15s ease;
  }
  .cell.x { color: var(--x); }
  .cell.o { color: var(--o); }
  .cell.win { background: var(--win); }
  .cell.playable:hover { background: var(--line); }
  .cell:disabled { cursor: default; opacity: 1; }

  .actions { display: flex; gap: 10px; }
  .actions button { flex: 1; }

  #notice {
    text-align: center; font-size: 14px; color: var(--x); min-height: 20px;
  }

  details.chat { background: var(--panel); border: 1px solid var(--line); border-radius: var(--radius); box-shadow: var(--shadow); }
  details.chat > summary { padding: 12px 14px; cursor: pointer; font-weight: 600; font-size: 14px; list-style: none; }
  details.chat > summary::-webkit-details-marker { display: none; }
  details.chat > summary::after { content: " ▾"; color: var(--muted); }
  details.chat[open] > summary::after { content: " ▴"; }
  #messages { max-height: 190px; overflow-y: auto; padding: 0 14px; display: flex; flex-direction: column; gap: 6px; font-size: 14px; }
  #messages .msg b { font-weight: 700; }
  #messages .sys { color: var(--muted); font-style: italic; font-size: 13px; }
  .chat-form { display: flex; gap: 8px; padding: 12px 14px; }
  .chat-form input { flex: 1; }
  .chat-form button { flex: 0 0 auto; }

  #watchers { text-align: center; font-size: 13px; color: var(--muted); }

  .conn { display: flex; align-items: center; justify-content: center; gap: 6px; font-size: 12px; color: var(--muted); }
  .dot { width: 8px; height: 8px; border-radius: 50%; background: var(--muted); }
  .conn.live .dot { background: var(--o); }
  .conn.down .dot { background: var(--x); }

  [hidden] { display: none !important; }
  .sr-only {
    position: absolute; width: 1px; height: 1px; padding: 0; margin: -1px;
    overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; border: 0;
  }
</style>
</head>
<body>

<h1>Family Tic Tac Toe
  <small>One link. Everyone plays, wherever they are.</small>
</h1>

<!-- ---------- lobby ---------- -->
<section id="lobby" class="panel">
  <div class="stack">
    <div>
      <label for="name-input">Your name</label>
      <input id="name-input" type="text" maxlength="20" placeholder="Grandma" autocomplete="nickname" />
    </div>

    <button id="family-btn" class="primary">Join the family game</button>

    <div class="divider">or</div>

    <button id="create-btn">Start a separate game</button>

    <form id="join-form" class="row">
      <input id="code-input" type="text" maxlength="4" placeholder="CODE"
             inputmode="latin" autocomplete="off" autocapitalize="characters"
             aria-label="Room code" />
      <button type="submit">Join</button>
    </form>

    <p id="lobby-error" class="sr-only" role="alert"></p>
  </div>
</section>

<!-- ---------- game ---------- -->
<section id="game" hidden>
  <div class="roombar">
    <div>
      <div class="code-label">Room code</div>
      <div class="code" id="room-code">----</div>
    </div>
    <div class="row" style="flex:0 0 auto">
      <button id="share-btn">Copy link</button>
      <button id="leave-btn">Leave</button>
    </div>
  </div>

  <div class="scoreboard">
    <div class="side x" id="side-x">
      <div class="mark">X</div>
      <div class="who empty" id="name-x">open seat</div>
      <div class="away" id="away-x" hidden>reconnecting…</div>
      <div class="score" id="score-x">0</div>
      <button id="sit-x" hidden>Take this seat</button>
    </div>

    <div class="draws">draws<b id="score-draws">0</b></div>

    <div class="side o" id="side-o">
      <div class="mark">O</div>
      <div class="who empty" id="name-o">open seat</div>
      <div class="away" id="away-o" hidden>reconnecting…</div>
      <div class="score" id="score-o">0</div>
      <button id="sit-o" hidden>Take this seat</button>
    </div>
  </div>

  <div id="status" role="status" aria-live="polite">Connecting…</div>

  <div class="board" id="board" role="grid" aria-label="Tic tac toe board"></div>

  <div id="notice" role="alert"></div>

  <div class="actions">
    <button id="rematch-btn" class="primary" disabled>Play again</button>
    <button id="reset-btn">Reset score</button>
  </div>

  <div id="watchers"></div>

  <details class="chat">
    <summary>Chat</summary>
    <div id="messages" aria-live="polite"></div>
    <form class="chat-form" id="chat-form">
      <input id="chat-input" type="text" maxlength="200" placeholder="Say something…" autocomplete="off" />
      <button type="submit">Send</button>
    </form>
  </details>

  <div class="conn" id="conn"><span class="dot"></span><span id="conn-text">connecting…</span></div>
</section>

<script>
(() => {
  "use strict";

  // The room everyone lands in when the URL carries no ?room= of its own, so
  // the bare link is all the family needs. Change these four characters to
  // move the household to a fresh room (and a fresh scoreboard).
  const DEFAULT_ROOM = "PLA4";

  // --- identity -----------------------------------------------------------
  // A stable id per browser lets someone refresh (or drop off wifi) and get
  // their seat back instead of being demoted to a spectator.
  const store = {
    get(key, fallback) {
      try { return localStorage.getItem(key) ?? fallback; } catch { return fallback; }
    },
    set(key, value) {
      try { localStorage.setItem(key, value); } catch { /* private mode */ }
    },
  };

  let playerId = store.get("ttt:playerId", "");
  if (!playerId) {
    playerId = (crypto.randomUUID?.() ?? String(Math.random()).slice(2) + Date.now());
    store.set("ttt:playerId", playerId);
  }
  let playerName = store.get("ttt:name", "");

  // --- elements -----------------------------------------------------------
  const $ = (id) => document.getElementById(id);
  const lobby = $("lobby"), game = $("game");
  const nameInput = $("name-input"), codeInput = $("code-input");
  const boardEl = $("board"), statusEl = $("status"), noticeEl = $("notice");
  const connEl = $("conn"), connText = $("conn-text");
  const messagesEl = $("messages"), watchersEl = $("watchers");
  const rematchBtn = $("rematch-btn"), resetBtn = $("reset-btn");
  const lobbyError = $("lobby-error");

  nameInput.value = playerName;

  // --- board cells --------------------------------------------------------
  const cells = [];
  for (let i = 0; i < 9; i++) {
    const cell = document.createElement("button");
    cell.className = "cell";
    cell.type = "button";
    cell.dataset.index = String(i);
    cell.setAttribute("aria-label", `Square ${i + 1}, empty`);
    cell.addEventListener("click", () => send({ type: "move", index: i }));
    boardEl.appendChild(cell);
    cells.push(cell);
  }

  // --- connection ---------------------------------------------------------
  let socket = null;
  let roomCode = null;
  let retryDelay = 500;
  let heartbeat = null;
  let deliberateClose = false;

  function send(message) {
    if (socket && socket.readyState === WebSocket.OPEN) {
      socket.send(JSON.stringify(message));
    }
  }

  function setConn(kind, text) {
    connEl.className = "conn " + kind;
    connText.textContent = text;
  }

  function connect(code) {
    roomCode = code;
    deliberateClose = false;
    $("room-code").textContent = code;
    lobby.hidden = true;
    game.hidden = false;
    setConn("", "connecting…");

    const scheme = location.protocol === "https:" ? "wss:" : "ws:";
    const url = `${scheme}//${location.host}/api/room/${code}`
      + `?playerId=${encodeURIComponent(playerId)}&name=${encodeURIComponent(playerName || "Player")}`;

    socket = new WebSocket(url);

    socket.addEventListener("open", () => {
      retryDelay = 500;
      setConn("live", "connected");
      clearInterval(heartbeat);
      // Matches the Durable Object's auto-response pair, so this keeps the
      // connection warm through proxies without waking the room.
      heartbeat = setInterval(() => {
        if (socket?.readyState === WebSocket.OPEN) socket.send("ping");
      }, 25000);
    });

    socket.addEventListener("message", (event) => {
      if (event.data === "pong") return;
      let msg;
      try { msg = JSON.parse(event.data); } catch { return; }
      if (msg.type === "state") render(msg);
      else if (msg.type === "notice") flash(msg.message);
    });

    socket.addEventListener("close", () => {
      clearInterval(heartbeat);
      if (deliberateClose) return;
      setConn("down", "reconnecting…");
      setTimeout(() => connect(code), retryDelay);
      retryDelay = Math.min(retryDelay * 2, 8000);
    });

    socket.addEventListener("error", () => socket?.close());
  }

  function disconnect() {
    deliberateClose = true;
    clearInterval(heartbeat);
    socket?.close();
    socket = null;
  }

  let noticeTimer = null;
  function flash(message) {
    noticeEl.textContent = message;
    clearTimeout(noticeTimer);
    noticeTimer = setTimeout(() => { noticeEl.textContent = ""; }, 3000);
  }

  // --- rendering ----------------------------------------------------------
  function render(state) {
    const you = state.you.seat;
    const yourTurn = you !== null && state.turn === you && state.ready && !state.over;

    // board
    state.board.forEach((mark, i) => {
      const cell = cells[i];
      cell.textContent = mark ?? "";
      const playable = yourTurn && mark === null;
      cell.className = "cell"
        + (mark === "X" ? " x" : mark === "O" ? " o" : "")
        + (state.line?.includes(i) ? " win" : "")
        + (playable ? " playable" : "");
      cell.disabled = !playable;
      cell.setAttribute("aria-label", `Square ${i + 1}, ${mark ?? "empty"}`);
    });

    // seats
    for (const mark of ["X", "O"]) {
      const seat = state.seats[mark];
      const lower = mark.toLowerCase();
      const nameEl = $(`name-${lower}`);
      nameEl.textContent = seat ? seat.name : "open seat";
      nameEl.classList.toggle("empty", !seat);
      $(`away-${lower}`).hidden = !seat || seat.connected;
      $(`score-${lower}`).textContent = state.scores[mark];
      $(`side-${lower}`).classList.toggle("active", state.turn === mark && state.ready && !state.over);
      // Spectators can claim a seat the moment one opens up.
      $(`sit-${lower}`).hidden = !(seat === null && you === null);
    }
    $("score-draws").textContent = state.scores.draws;

    // status
    let text, isWin = false;
    if (!state.ready) {
      text = "Waiting for another player — share the code above.";
    } else if (state.over) {
      isWin = true;
      if (state.draw) {
        text = "Draw. Nobody blinked.";
      } else {
        const winner = state.seats[state.winner];
        text = you === state.winner
          ? `You win as ${state.winner}!`
          : `${winner ? winner.name : state.winner} wins as ${state.winner}!`;
      }
    } else if (you === null) {
      const upNext = state.seats[state.turn];
      text = `Watching — ${upNext ? upNext.name : state.turn} to move.`;
    } else if (yourTurn) {
      text = `Your turn (${you})`;
    } else {
      const other = state.seats[state.turn];
      text = `${other ? other.name : state.turn} is thinking…`;
    }
    statusEl.textContent = text;
    statusEl.classList.toggle("win", isWin);

    rematchBtn.disabled = !(state.over && you !== null);
    resetBtn.disabled = you === null;

    // watchers
    const onlookers = state.watchers.filter((w) => w.seat === null);
    watchersEl.textContent = onlookers.length
      ? `Watching: ${onlookers.map((w) => w.name).join(", ")}`
      : "";

    renderChat(state.chat);
  }

  let lastChatId = 0;
  function renderChat(chat) {
    const newest = chat.length ? chat[chat.length - 1].id : 0;
    if (newest === lastChatId) return;
    lastChatId = newest;

    messagesEl.replaceChildren();
    for (const message of chat) {
      const line = document.createElement("div");
      if (message.name) {
        line.className = "msg";
        const who = document.createElement("b");
        who.textContent = message.name + ": ";
        line.append(who, document.createTextNode(message.text));
      } else {
        line.className = "sys";
        line.textContent = message.text;
      }
      messagesEl.appendChild(line);
    }
    messagesEl.scrollTop = messagesEl.scrollHeight;
  }

  // --- lobby actions ------------------------------------------------------
  function currentName() {
    const name = nameInput.value.trim().slice(0, 20);
    if (name && name !== playerName) {
      playerName = name;
      store.set("ttt:name", name);
    }
    return playerName || "Player";
  }

  function enterRoom(code) {
    currentName();
    const url = new URL(location.href);
    url.searchParams.set("room", code);
    history.replaceState(null, "", url);
    connect(code);
  }

  $("create-btn").addEventListener("click", async (event) => {
    const button = event.currentTarget;
    button.disabled = true;
    button.textContent = "Creating…";
    try {
      const response = await fetch("/api/create", { method: "POST" });
      const data = await response.json();
      if (!response.ok) throw new Error(data.error || "Could not create a game.");
      enterRoom(data.code);
    } catch (error) {
      lobbyError.classList.remove("sr-only");
      lobbyError.textContent = error.message;
    } finally {
      button.disabled = false;
      button.textContent = "Start a new game";
    }
  });

  $("join-form").addEventListener("submit", (event) => {
    event.preventDefault();
    const code = codeInput.value.trim().toUpperCase();
    if (code.length !== 4) {
      lobbyError.classList.remove("sr-only");
      lobbyError.textContent = "Room codes are 4 characters.";
      return;
    }
    enterRoom(code);
  });

  // --- game actions -------------------------------------------------------
  rematchBtn.addEventListener("click", () => send({ type: "rematch" }));
  resetBtn.addEventListener("click", () => send({ type: "resetScores" }));
  $("sit-x").addEventListener("click", () => send({ type: "sit", seat: "X" }));
  $("sit-o").addEventListener("click", () => send({ type: "sit", seat: "O" }));

  $("share-btn").addEventListener("click", async (event) => {
    const button = event.currentTarget;
    const link = `${location.origin}/?room=${roomCode}`;
    try {
      if (navigator.share && matchMedia("(pointer: coarse)").matches) {
        await navigator.share({ title: "Tic Tac Toe", text: `Join my game — code ${roomCode}`, url: link });
        return;
      }
      await navigator.clipboard.writeText(link);
      button.textContent = "Copied!";
    } catch {
      button.textContent = link;
    }
    setTimeout(() => { button.textContent = "Copy link"; }, 1800);
  });

  $("leave-btn").addEventListener("click", () => {
    send({ type: "stand" });
    disconnect();
    const url = new URL(location.href);
    url.searchParams.delete("room");
    history.replaceState(null, "", url);
    game.hidden = true;
    lobby.hidden = false;
    lastChatId = 0;
  });

  $("chat-form").addEventListener("submit", (event) => {
    event.preventDefault();
    const input = $("chat-input");
    const text = input.value.trim();
    if (!text) return;
    send({ type: "chat", text });
    input.value = "";
  });

  nameInput.addEventListener("change", () => {
    const name = currentName();
    if (socket?.readyState === WebSocket.OPEN) send({ type: "rename", name });
  });

  // --- start --------------------------------------------------------------
  // An explicit ?room= wins; otherwise everyone converges on the family room.
  const fromLink = new URLSearchParams(location.search).get("room");
  const targetRoom = fromLink && /^[A-Za-z0-9]{4}$/.test(fromLink)
    ? fromLink.toUpperCase()
    : DEFAULT_ROOM;

  $("family-btn").textContent = `Join the game (${targetRoom})`;
  $("family-btn").addEventListener("click", () => enterRoom(targetRoom));

  if (playerName) {
    enterRoom(targetRoom);
  } else {
    // A first-time visitor still says who they are before walking in.
    codeInput.value = targetRoom;
    nameInput.focus();
    nameInput.addEventListener("keydown", (event) => {
      if (event.key === "Enter" && !socket) enterRoom(targetRoom);
    });
  }
})();
</script>
</body>
</html>
